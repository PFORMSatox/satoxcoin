<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e84393;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#e84393" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#e84393" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#e84393" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="200" stroke="#6c5ce7" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="200" stroke="#6c5ce7" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="200" stroke="#6c5ce7" stroke-width="1"/>
  </g>
  <!-- Accent line -->
  <rect x="0" y="95" width="800" height="2" fill="url(#accent)" opacity="0.4"/>
  <!-- S Logo Mark -->
  <g transform="translate(50, 35)">
    <polygon points="0,60 30,30 0,0 30,30" fill="url(#accent)" opacity="0.15"/>
    <polygon points="15,75 45,45 15,15 45,45" fill="url(#accent)" opacity="0.3"/>
    <text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="url(#accent)" text-anchor="middle">S</text>
  </g>
  <!-- SATOX text -->
  <text x="120" y="72" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="4">SATOX</text>
  <!-- Tagline -->
  <text x="120" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a29bfe" letter-spacing="2">PLAY 2 EARN  BLOCKCHAIN</text>
  <!-- Version badge -->
  <rect x="550" y="40" width="120" height="30" rx="5" fill="url(#accent)" opacity="0.9"/>
  <text x="610" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">v4.0.0</text>
  <!-- Tech badges -->
  <rect x="690" y="40" width="70" height="30" rx="5" fill="#636e72" opacity="0.6"/>
  <text x="725" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BTC 31.1</text>
  <!-- Bottom info -->
  <text x="400" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#636e72" text-anchor="middle" letter-spacing="1">KAWPOW  •  ASSETS  •  PLAY2EARN</text>
  <text x="400" y="180" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#4a4a5a" text-anchor="middle" letter-spacing="1">satoverse.io</text>
</svg>
