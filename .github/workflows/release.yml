name: Release

on:
  push:
    tags:
      - 'v*'

jobs:

  linux-build:
    name: 'Linux x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ python3 pkg-config \
            libboost-dev libevent-dev libsqlite3-dev

      - name: Configure + Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TX=ON \
            -DBUILD_WALLET_TOOL=ON
          cmake --build build -j$(nproc)

      - name: Package
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          cd build
          tar czf ../satoxcoin-${VERSION}-x86_64-linux.tar.gz \
            bin/satoxcoind bin/satoxcoin-cli bin/satoxcoin-tx bin/satoxcoin-wallet

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: satoxcoin-linux-x86_64
          path: satoxcoin-*-x86_64-linux.tar.gz

  macos-build:
    name: 'macOS x86_64'
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Install dependencies
        run: brew install cmake boost libevent sqlite

      - name: Configure + Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TX=ON \
            -DBUILD_WALLET_TOOL=ON
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          cd build
          tar czf ../satoxcoin-${VERSION}-x86_64-macos.tar.gz \
            bin/satoxcoind bin/satoxcoin-cli bin/satoxcoin-tx bin/satoxcoin-wallet

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: satoxcoin-x86_64-macos
          path: satoxcoin-*-x86_64-macos.tar.gz

  windows-build:
    name: 'Windows x86_64'
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure + Build
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TX=ON \
            -DBUILD_WALLET_TOOL=ON
          cmake --build build --config Release -j 4

      - name: Package
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}" -replace '^v',''
          Compress-Archive -Path build/bin/Release/satoxcoind.exe,build/bin/Release/satoxcoin-cli.exe,build/bin/Release/satoxcoin-tx.exe,build/bin/Release/satoxcoin-wallet.exe -DestinationPath "satoxcoin-${VERSION}-win64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: satoxcoin-win64
          path: satoxcoin-*-win64.zip

  docker-build:
    name: 'Docker Image (linux/amd64)'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/satoxcoind
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: 'Create GitHub Release'
    needs: [linux-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: satoxcoin-*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}"
          body: |
            ## Satoxcoin Core ${{ github.ref_name }}

            **Algorithm:** KawPoW
            **Base:** Bitcoin Core 31.1

            ### What's New
            - BTC 31.1 security base (16 CVEs fixed)
            - KAWPOW security hardening (mix_hash forgery, nHeight forgery, epoch-DoS)
            - Asset system hardening (ConnectBlock/DisconnectBlock non-fatal failures, reissue overflow, flush corruption)
            - Full address/spent/timestamp index system with 7 RPCs
            - HIP2 8MB blocks
            - 55 mainnet checkpoints

            ### Downloads

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `satoxcoin-${{ github.ref_name }}-x86_64-linux.tar.gz` |
            | macOS x86_64 | `satoxcoin-${{ github.ref_name }}-x86_64-macos.tar.gz` |
            | Windows x86_64 | `satoxcoin-${{ github.ref_name }}-win64.zip` |
            | Docker | `ghcr.io/${{ github.repository }}/satoxcoind:${{ github.ref_name }}` |

            See [doc/build-unix.md](doc/build-unix.md) (Linux/macOS) and [doc/build-windows-msvc.md](doc/build-windows-msvc.md) (Windows) for build instructions.
            See [doc/security/audit/phase5-btc31-rebase-plan.md](doc/security/audit/phase5-btc31-rebase-plan.md) for the full audit and CVE analysis.
          files: |
            artifacts/satoxcoin-*/satoxcoin-*-x86_64-linux.tar.gz
            artifacts/satoxcoin-*/satoxcoin-*-x86_64-macos.tar.gz
            artifacts/satoxcoin-*/satoxcoin-*-win64.zip
          draft: false
