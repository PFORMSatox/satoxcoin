name: Release

on:
  push:
    tags:
      - 'v*'

# Default least-privilege; jobs escalate only where needed (packages:write, contents:write)
permissions:
  contents: read

jobs:

  linux-build:
    name: 'Linux x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ python3 pkg-config \
            libboost-dev libevent-dev libsqlite3-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools qt6-tools-dev-tools libgl-dev \
            libqrencode-dev

      - name: Configure + Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_GUI=ON \
            -DBUILD_TX=ON \
            -DBUILD_WALLET_TOOL=ON
          cmake --build build -j$(nproc)

      - name: Package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          cd build
          tar czf ../satoxcoin-${VERSION}-x86_64-linux.tar.gz \
            bin/satoxcoind bin/satoxcoin-cli bin/satoxcoin-tx bin/satoxcoin-wallet
          tar czf ../satoxcoin-${VERSION}-x86_64-linux-qt.tar.gz \
            bin/satoxcoin-qt

      - name: Upload daemon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satoxcoin-linux-x86_64
          path: satoxcoin-*-x86_64-linux.tar.gz

      - name: Upload Qt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satoxcoin-linux-x86_64-qt
          path: satoxcoin-*-x86_64-linux-qt.tar.gz

  macos-build:
    name: 'macOS x86_64'
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Install dependencies
        run: brew install cmake boost libevent sqlite qt@6 qrencode

      - name: Configure + Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_GUI=ON \
            -DBUILD_TX=ON \
            -DBUILD_WALLET_TOOL=ON
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          cd build
          tar czf ../satoxcoin-${VERSION}-x86_64-macos.tar.gz \
            bin/satoxcoind bin/satoxcoin-cli bin/satoxcoin-tx bin/satoxcoin-wallet
          tar czf ../satoxcoin-${VERSION}-x86_64-macos-qt.tar.gz \
            bin/satoxcoin-qt

      - name: Upload daemon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satoxcoin-x86_64-macos
          path: satoxcoin-*-x86_64-macos.tar.gz

      - name: Upload Qt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satoxcoin-x86_64-macos-qt
          path: satoxcoin-*-x86_64-macos-qt.tar.gz

  windows-build:
    name: 'Windows x86_64'
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure + Build
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_GUI=ON \
            -DBUILD_TX=ON \
            -DBUILD_WALLET_TOOL=ON
          cmake --build build --config Release -j 4

      - name: Package
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $VERSION = "$env:TAG_NAME" -replace '^v',''
          New-Item -ItemType Directory -Path "pkg/satoxcoin-$VERSION-win64/platforms" -Force | Out-Null
          Copy-Item build/bin/Release/satoxcoind.exe,build/bin/Release/satoxcoin-cli.exe,build/bin/Release/satoxcoin-tx.exe,build/bin/Release/satoxcoin-wallet.exe,build/bin/Release/satoxcoin-qt.exe -Destination "pkg/satoxcoin-$VERSION-win64/"
          Copy-Item build/vcpkg_installed/x64-windows/bin/*.dll -Destination "pkg/satoxcoin-$VERSION-win64/"
          Copy-Item build/vcpkg_installed/x64-windows/Qt6/plugins/platforms/qwindows.dll -Destination "pkg/satoxcoin-$VERSION-win64/platforms/"
          Compress-Archive -Path "pkg/satoxcoin-$VERSION-win64" -DestinationPath "satoxcoin-${VERSION}-win64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satoxcoin-win64
          path: satoxcoin-*-win64.zip

  docker-build:
    name: 'Docker Image (linux/amd64)'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}/satoxcoind
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: 'Create GitHub Release'
    needs: [linux-build, macos-build, windows-build, docker-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          pattern: satoxcoin-*

      - name: Generate SHA256SUMS
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} \; | sed 's|artifacts/||' | sort > SHA256SUMS
          cat SHA256SUMS
          # also place a copy next to each artifact dir for provenance
          cp SHA256SUMS artifacts/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@f9eaf234fc1c2e333c1eca18177db0f44fa6ba52 # v2.2.1
        with:
          subject-path: 'artifacts/satoxcoin-*/*'

      - name: Create Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          name: "${{ github.ref_name }}"
          body: |
            ## Satoxcoin Core ${{ github.ref_name }}

            **Algorithm:** KawPoW
            **Base:** Bitcoin Core 31.1

            ### What's New
            - BTC 31.1 security base (16 CVEs fixed)
            - KAWPOW security hardening (mix_hash forgery, nHeight forgery, epoch-DoS)
            - Asset system hardening (ConnectBlock/DisconnectBlock non-fatal failures, reissue overflow, flush corruption)
            - Full address/spent/timestamp index system with 7 RPCs
            - HIP2 8MB blocks
            - 55 mainnet checkpoints

            ### Downloads

            | Platform | Daemon | GUI |
            |----------|--------|-----|
            | Linux x86_64 | `satoxcoin-${{ github.ref_name }}-x86_64-linux.tar.gz` | `satoxcoin-${{ github.ref_name }}-x86_64-linux-qt.tar.gz` |
            | macOS x86_64 | `satoxcoin-${{ github.ref_name }}-x86_64-macos.tar.gz` | `satoxcoin-${{ github.ref_name }}-x86_64-macos-qt.tar.gz` |
            | Windows x86_64 | `satoxcoin-${{ github.ref_name }}-win64.zip` | `satoxcoin-${{ github.ref_name }}-win64.zip` (includes satoxcoin-qt.exe) |
            | Docker | `ghcr.io/${{ github.repository }}/satoxcoind:${{ github.ref_name }}` | — |

            See [doc/build-unix.md](doc/build-unix.md) (Linux/macOS) and [doc/build-windows-msvc.md](doc/build-windows-msvc.md) (Windows) for build instructions.
            See [doc/security/audit/phase5-btc31-rebase-plan.md](doc/security/audit/phase5-btc31-rebase-plan.md) for the full audit and CVE analysis.
          files: |
            artifacts/satoxcoin-*/satoxcoin-*-x86_64-linux.tar.gz
            artifacts/satoxcoin-*/satoxcoin-*-x86_64-linux-qt.tar.gz
            artifacts/satoxcoin-*/satoxcoin-*-x86_64-macos.tar.gz
            artifacts/satoxcoin-*/satoxcoin-*-x86_64-macos-qt.tar.gz
            artifacts/satoxcoin-*/satoxcoin-*-win64.zip
            SHA256SUMS
          draft: false
