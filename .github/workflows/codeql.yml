# CodeQL SAST — C/C++ analysis for supply-chain / vuln scanning
# Runs on push/PR to main + weekly schedule. Findings -> Security tab.

name: CodeQL

on:
  push:
    branches: [main, 'rebase/*']
  pull_request:
    branches: [main, 'rebase/*']
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [cpp]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4d2851c4593439ac10bdcd57c5b06cac73b4775 # v3.37.8
        with:
          languages: ${{ matrix.language }}
          # queries: security-extended — uncomment for extended coverage (slower)
          # queries: security-extended

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ python3 pkg-config \
            libboost-dev libevent-dev libsqlite3-dev

      - name: Build (for CodeQL extraction)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IPC=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF
          cmake --build build -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4d2851c4593439ac10bdcd57c5b06cac73b4775 # v3.37.8
        with:
          category: "/language:${{ matrix.language }}"
