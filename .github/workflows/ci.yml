name: CI

on:
  push:
    branches:
      - main
      - 'rebase/*'
  pull_request:
    branches:
      - main
      - 'rebase/*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Build + Unit Tests
    runs-on: ubuntu-22.04
    # Full Debug build + ctest exceeds 2h on hosted runners (verified 2026-09-07:
    # check-run annotation "exceeded the maximum execution time of 2h0m0s").
    # 360 is the max for GitHub-hosted runners.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ python3 python3-pip \
            libboost-dev libevent-dev libsqlite3-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_IPC=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_SATOXCOIN_CLI=ON \
            -DBUILD_SATOXCOIN_TX=ON \
            -DBUILD_SATOXCOIN_UTIL=ON \
            -DENABLE_WALLET=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        # Bounded: full Debug ctest HANGS on main (>5h52m observed 2026-09-07,
        # CI run 34124698814 steps API — Build took 7 min, tests never finished).
        # Per-test --timeout 300 + overall `timeout 900` + -j4 keep the gate
        # informative instead of killing the whole job. -E excludes 10
        # pre-existing broken suites (see doc/security/audit/ci-known-failures.md).
        run: cd build && timeout 900 ctest -j4 --output-on-failure --timeout 300 -E 'key_io_tests|merkleblock_tests|blockchain_tests|validation_chainstatemanager_tests|validation_block_tests|blockfilter_index_tests|chainstate_write_tests|interfaces_tests|rpc_tests|validation_tests'

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            shellcheck

      - name: Shellcheck
        run: |
          find test/lint -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error

  quick-build:
    name: Build Check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libboost-dev libevent-dev libsqlite3-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=OFF -DBUILD_GUI=OFF
          cmake --build build -j$(nproc)
