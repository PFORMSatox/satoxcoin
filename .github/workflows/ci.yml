name: CI

on:
  push:
    branches:
      - main
      - 'rebase/*'
  pull_request:
    branches:
      - main
      - 'rebase/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Build + Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ python3 python3-pip \
            libboost-dev libevent-dev libsqlite3-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_IPC=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_SATOXCOIN_CLI=ON \
            -DBUILD_SATOXCOIN_TX=ON \
            -DBUILD_SATOXCOIN_UTIL=ON \
            -DENABLE_WALLET=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        run: cd build && ctest -j$(nproc) --output-on-failure

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            shellcheck

      - name: Shellcheck
        run: |
          find test/lint/test_scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=error || true

  quick-build:
    name: Build Check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libboost-dev libevent-dev libsqlite3-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=OFF -DBUILD_GUI=OFF
          cmake --build build -j$(nproc)
