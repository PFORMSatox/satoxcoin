name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'rebase/*'

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1

defaults:
  run:
    shell: bash

jobs:

  linux-build:
    name: 'Build + Unit Tests (Ubuntu)'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ python3 python3-pip \
            libboost-dev libevent-dev libsqlite3-dev
          pip3 install --break-system-packages pytest

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_IPC=OFF \
            -DBUILD_SATOXCOIN_CLI=ON \
            -DBUILD_SATOXCOIN_TX=ON \
            -DBUILD_SATOXCOIN_UTIL=ON \
            -DENABLE_WALLET=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        run: cd build && ctest -j$(nproc) --output-on-failure

  lint:
    name: 'Lint + Formatting'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check commit message format
        if: github.event_name == 'pull_request'
        run: |
          MSG=$(git log --format=%s -1 HEAD)
          if ! echo "$MSG" | grep -qE "^(feat|fix|docs|test|chore|ci|build|refactor|perf|style|revert): .{5,}"; then
            echo "Commit message must follow conventional commits format:"
            echo "  feat: description"
            echo "  fix: description"
            echo "  docs: description"
            echo "  etc."
            exit 1
          fi

  quick-build:
    name: 'Build Check (no tests)'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libboost-dev libevent-dev libsqlite3-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=OFF
          cmake --build build -j$(nproc)
